{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 400px; margin-top: 50px;">
    <div class="card-body">
        <h3 class="text-center mb-4">Ro'yxatdan o'tish</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Login tanlang" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parol</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Rolingiz</label>
                <select name="role" class="form-select">
                    <option value="user">Oddiy foydalanuvchi</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Hisob yaratish</button>
        </form>
        <div class="text-center mt-3">
            <small>Profilingiz bormi? <a href="{% url 'login' %}">Kirish</a></small>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>FileCloud - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">☁️ FileCloud</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link text-white">Salom, {{ user.username }}</span>
                    {% if user.role == 'admin' %}
                        <a class="nav-link btn btn-warning btn-sm text-dark mx-2" href="{% url 'admin_files' %}">Admin Panel</a>
                    {% endif %}
                    <li class="nav-item">
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-sm">Chiqish</button>
                        </form>
                    </li>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Kirish</a>
                    <a class="nav-link" href="{% url 'register' %}">Ro'yxatdan o'tish</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
